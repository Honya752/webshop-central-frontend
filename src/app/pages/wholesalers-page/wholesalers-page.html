<p-toast />

<p-card>
    <p-table [value]="wholesalers()" [loading]="isLoading()">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Wholesalers</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>URL</th>
                <th>Store Type</th>
                <th></th>
            </tr>
        </ng-template>

        <ng-template #body let-store>
            <tr>
                <td>
                    <a href="store.baseUrl">{{store.name}}</a>
                </td>
                <td>{{store.baseUrl}}</td>
                <td>{{store.integrationType}}</td>
                <td>
                    <p-button class="float-right" icon="pi pi-sync" [rounded]="true" severity="secondary"
                        [outlined]="true" (click)="syncWholesalerCatalog(store.id)" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div #loadMoreTrigger class="h-4"></div>
</p-card>
