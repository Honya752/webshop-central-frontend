<p-toast />

<p-card>
    <p-table [value]="wholesalers()" [loading]="isLoading()">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Wholesalers</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>URL</th>
                <th>Integration type</th>
                <th></th>
            </tr>
        </ng-template>

        <ng-template #body let-wholesaler>
            <tr>
                <td>
                    <a [href]="wholesaler.baseUrl">{{wholesaler.name}}</a>
                </td>
                <td>{{wholesaler.baseUrl}}</td>
                <td>{{wholesaler.integrationType}}</td>
                <td>
                    <p-button class="float-right" icon="pi pi-sync" [rounded]="true" severity="secondary"
                        [outlined]="true" (click)="syncWholesalerCatalog(wholesaler.id)" />
                    <p-button class="float-right mr-2" icon="pi pi-pencil" [rounded]="true" severity="success"
                        [outlined]="true" [routerLink]="['/wholesaler', wholesaler.id]" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
