<p-card>
    <p-table [value]="stores()">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Orders</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>Region</th>
                <th>Store Type</th>
                <th>Version</th>
            </tr>
        </ng-template>

        <ng-template #body let-store>
            <tr>
                <td>
                    <a [href]="store.baseUrl">{{store.name}}</a>
                </td>
                <td>{{store.region}}</td>
                <td>{{store.integrationType}}</td>
                <td>{{store.integrationVer}}</td>
            </tr>
        </ng-template>
    </p-table>

    @if (isLoading()) {
    <div class="card flex justify-center">
        <p-progress-spinner ariaLabel="loading" />
    </div>
    }

    <div #loadMoreTrigger class="h-4"></div>
</p-card>
