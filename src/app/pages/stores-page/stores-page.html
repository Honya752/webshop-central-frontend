<p-card>
    <p-table [value]="stores()" [loading]="isLoading()">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Orders</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>Region</th>
                <th>Store Type</th>
                <th>Version</th>
                <th class="flex gap-2 justify-end">Actions</th>
            </tr>
        </ng-template>

        <ng-template #body let-store>
            <tr>
                <td>
                    <a [href]="store.baseUrl">{{store.name}}</a>
                </td>
                <td class="text-2xl">{{getFlagEmoji(store.region)}}</td>
                <td>{{store.integrationType}}</td>
                <td class="font-mono">{{store.integrationVer}}</td>
                <td>
                    <p-button icon="pi pi-pencil" [rounded]="true" severity="success" [outlined]="true"
                        [routerLink]="['/store', store.id]" class="ml-4 float-right" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div #loadMoreTrigger class="h-4"></div>
</p-card>
