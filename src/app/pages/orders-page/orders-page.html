<p-card>
    <form [formGroup]="filterForm" class="flex flex-row gap-4 items-center">
        <h1 class="font-bold w-full">Sort Orders</h1>

        <p-select [options]="sortByOptions" formControlName="sortBy" optionLabel="label" optionValue="value"
            placeholder="Rendezés" class="w-full md:w-56" />

        <p-select [options]="sortOrderOptions" formControlName="sortOrder" optionLabel="label" optionValue="value"
            placeholder="Sorrend" class="w-full md:w-56" />
    </form>
</p-card>

<p-card class="w-full mt-4">
    <p-table [value]="orders()" [tableStyle]="{ 'min-width': '60rem' }">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Orders</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Status</th>
                <th>Store</th>
                <th>Create At</th>
                <th>Total price</th>
                <th>Payment Method</th>
                <th>Operations</th>
            </tr>
        </ng-template>

        <ng-template #body let-order>
            <tr>
                <td>{{order.status}}</td>
                <td>{{order.store.name}}</td>
                <td>{{ order.createdAt | date:'yyyy.MM.dd. HH:mm' }}</td>
                <td>{{ order.total | currency:order.currency:'symbol':'1.0-0' }}</td>
                <td>{{order.paymentMethod}}</td>
                <td></td>
            </tr>
        </ng-template>
    </p-table>

    @if (isLoading()) {
    <div class="card flex justify-center">
        <p-progress-spinner ariaLabel="loading" />
    </div>
    }

    <div #loadMoreTrigger class="h-4"></div>
</p-card>
