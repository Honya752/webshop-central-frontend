<p-toast />
<p-confirmdialog />

<p-card>
    <form [formGroup]="filterForm" class="flex flex-row gap-4">
        <p-inputgroup>
            <p-button label="Search" severity="contrast" />
            <input pInputText type="search" formControlName="search" placeholder="Search by name, EAN or SKU codes" />
        </p-inputgroup>

        <p-select [options]="sortByOptions" formControlName="sortBy" optionLabel="label" optionValue="value"
            placeholder="Rendezés" class="w-full md:w-56" />

        <p-select [options]="sortOrderOptions" formControlName="sortOrder" optionLabel="label" optionValue="value"
            placeholder="Sorrend" class="w-full md:w-56" />
    </form>
</p-card>

<p-card class="w-full mt-4">
    <p-table [value]="products()" [loading]="isLoading()">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <span class="text-xl font-bold">Products</span>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>Image</th>
                <th>Status</th>
                <th>SKU</th>
                <th>EAN</th>
                <th>Price</th>
                <th class="flex gap-2 justify-end">Actions</th>
            </tr>
        </ng-template>

        <ng-template #body let-product>
            <tr>
                <td>{{ product.name }}</td>

                <td>
                    <img [src]="product.images?.[0]?.url" [alt]="product.name" class="w-24 rounded" />
                </td>

                <td>status</td>

                <td class="font-mono">{{ product.sku }}</td>

                <td class="font-mono">{{ product.ean }}</td>

                <td>{{ product.price | number }} Ft</td>

                <td>
                    <p-button icon="pi pi-chevron-right" [rounded]="true" severity="secondary" [outlined]="true"
                        [routerLink]="['/product', product.id]" class="ml-4 float-right" />
                    <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true"
                        (click)="confirmDelete($event, product.id)" class="ml-4 float-right" />
                    <p-button icon="pi pi-pencil" [rounded]="true" severity="success" [outlined]="true"
                        [routerLink]="['/product', product.id, 'edit']" class="ml-4 float-right" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <div #loadMoreTrigger class="h-4"></div>
</p-card>
