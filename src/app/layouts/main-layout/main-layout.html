<div class="min-h-screen bg-gray-100">
    <nav class="relative bg-white after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10
        shadow">
        <div class="mx-auto">
            <div class="relative flex h-12 items-center justify-between px-6">
                <div class="flex flex-1 items-center justify-start gap-6 ">
                    <a routerLink="/dashboard" class="nav-item nav-logo">Webshop Central</a>
                </div>
                <div class="flex h-16 items-center justify-between gap-4">
                    <span>{{ user?.name || user?.email }}</span>
                    <div class="nav-profile">
                        <i class="pi pi-user"></i>
                    </div>
                    <p-button icon="pi pi-sign-out" [rounded]="true" severity="danger" [outlined]="true"
                        (onClick)="logout()" />
                </div>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <div>
            <p-card>
                <div class="w-80 flex flex-col gap-2">
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-th-large"></i>
                            <span>Dashboard</span>
                        </div>
                    </div>
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-box"></i>
                            <span>Products</span>
                        </div>
                    </div>
                    <div class="sidebar-menu">
                        <a [routerLink]="['/products']" class="item-title">
                            <i class="pi pi-list"></i>
                            <span>All products</span>
                        </a>
                        <a routerLink="/product/create" class="item-title">
                            <i class="pi pi-plus-circle"></i>
                            <span>Create new product</span>
                        </a>
                    </div>
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-shopping-cart"></i>
                            <span>Orders</span>
                        </div>
                    </div>
                    <div class="sidebar-menu">
                        <a [routerLink]="['/orders']" class="item-title">
                            <i class="pi pi-list"></i>
                            <span>Incoming orders</span>
                        </a>
                    </div>
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-shop"></i>
                            <span>Stores</span>
                        </div>
                    </div>
                    <div class="sidebar-menu">
                        <a [routerLink]="['/stores']" class="item-title">
                            <i class="pi pi-list"></i>
                            <span>All stores</span>
                        </a>
                        <a routerLink="/store/create" class="item-title">
                            <i class="pi pi-plus-circle"></i>
                            <span>Add new store</span>
                        </a>
                    </div>
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-user"></i>
                            <span>Users</span>
                        </div>
                    </div>
                    <div class="sidebar-menu">
                        <a [routerLink]="['/users']" class="item-title">
                            <i class="pi pi-users"></i>
                            <span>All users</span>
                        </a>
                        <a routerLink="/user/create" class="item-title">
                            <i class="pi pi-user-plus"></i>
                            <span>Register new user</span>
                        </a>
                    </div>
                    <div class="sidebar-item">
                        <div class="item-title">
                            <i class="pi pi-truck"></i>
                            <span>Wholesalers</span>
                        </div>
                    </div>
                    <div class="sidebar-menu">
                        <a [routerLink]="['/wholesalers']" class="item-title">
                            <i class="pi pi-list"></i>
                            <span>All wholesalers</span>
                        </a>
                        <a routerLink="/wholesaler/create" class="item-title">
                            <i class="pi pi-cart-plus"></i>
                            <span>Add new wholesaler</span>
                        </a>
                    </div>
                </div>
            </p-card>
        </div>

        <div class="w-full">
            <router-outlet />
        </div>
    </div>

</div>
